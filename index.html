    <script>
      // If the build's own JS or CSS fails to load (a deploy caught mid-swap, or
      // a 404 the browser cached under the year-long /assets/ header), fetch the
      // failed files again past the cache and reload. Only before the app has
      // rendered - later, vite:preloadError in main.tsx handles it. At most three
      // tries in two minutes. Touches sessionStorage only, never progress.
      (function () {
        var KEY = 'flag-master-asset-retry'
        var failed = []
        window.addEventListener('error', function (e) {
          var el = e.target
          if (!el || (el.tagName !== 'SCRIPT' && el.tagName !== 'LINK')) return
          var url = el.src || el.href
          if (!url || url.indexOf('/assets/') < 0) return
          var root = document.getElementById('root')
          if (root && root.firstChild) return
          failed.push(url)
          if (failed.length > 1) return
          var n = 0
          try {
            var s = JSON.parse(sessionStorage.getItem(KEY) || '{}')
            if (Date.now() - (s.at || 0) < 120000) n = s.n || 0
            if (n >= 3) return
            sessionStorage.setItem(KEY, JSON.stringify({ n: n + 1, at: Date.now() }))
          } catch (_) {
            return
          }
          setTimeout(function () {
            Promise.all(failed.map(function (u) {
              return fetch(u, { cache: 'reload' }).catch(function () {})
            })).then(function () { location.reload() })
          }, 1000 * (n + 1))
        }, true)
      })()
    </script>
